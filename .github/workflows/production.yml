name: Production deployment
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:worker
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      READER_MODE: private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: npm ci
      - run: npm run build:reader
      - run: npm ci --prefix apps/chat-proxy --omit=dev
      - name: Deploy private production reader and API proxy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: apps/reader/dist
          api_location: apps/chat-proxy
          skip_app_build: true
      - name: Package production worker
        run: |
          npm run build:worker
          npm install --prefix .function-package --omit=dev
      - name: Deploy production worker
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP }}
          package: .function-package
          sku: flexconsumption
