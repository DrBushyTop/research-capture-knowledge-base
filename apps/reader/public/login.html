<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Access · Research library</title>
  <link rel="stylesheet" href="/access.css">
  <script type="module" src="/access.js"></script>
</head>
<body><main>
  <h1 id="heading">Sign in</h1>
  <p id="message" role="status">Use your invited GitHub account.</p>
  <div class="actions">
    <a id="primary" href="/.auth/login/github?post_login_redirect_uri=%2F">Sign in with GitHub</a>
    <button id="check" type="button">Check access again</button>
  </div>
  <a id="switch" href="/.auth/logout?post_logout_redirect_uri=%2Flogin.html" hidden>Sign out or switch account</a>
  <noscript><p>JavaScript is needed to check your access status. Sign in above, or sign out before switching accounts.</p><a href="/.auth/logout?post_logout_redirect_uri=%2Flogin.html">Sign out</a></noscript>
</main></body>
</html>
